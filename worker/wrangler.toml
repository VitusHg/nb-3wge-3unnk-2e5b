# Cloudflare Worker für den Dienstplan des Einsatztagebuchs (kostenloser Tarif).
# Kompatibel mit dem RKTel-Worker (gleicher Endpunkt /dienstplan.ics) und
# zusätzlich mit Benachrichtigungen bei Dienstplan-Änderungen.
#
# Secrets NICHT hier eintragen, sondern mit:
#   npx wrangler secret put ICS_URL
#   npx wrangler secret put ACCESS_TOKEN
name = "etb-dienstplan"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Erreichbar unter https://etb-dienstplan.<account-subdomain>.workers.dev
workers_dev = true
preview_urls = false

[vars]
# Herkunft der PWA (GitHub Pages). Mehrere Einträge kommagetrennt.
ALLOWED_ORIGINS = "https://vitushg.github.io"
# Die ICS_URL muss auf diesen Host zeigen.
UPSTREAM_HOST = "dienstplan.st.roteskreuz.at"

# Benachrichtigungen: Speicher für Geräte, letzten Stand und Schlüssel.
# Einmalig anlegen:  npx wrangler kv namespace create PUSH_KV
# und die ausgegebene id hier eintragen.
[[kv_namespaces]]
binding = "PUSH_KV"
id = "HIER_KV_ID_EINTRAGEN"

# Dienstplan alle 10 Minuten auf Änderungen prüfen
[triggers]
crons = ["*/10 * * * *"]

# Keine Laufzeit-Logs/Traces speichern (Datensparsamkeit).
[observability]
enabled = false
